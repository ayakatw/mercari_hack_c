<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8d78ea">
  <meta name="description" content="推し活投稿がそのままポートフォリオになる、メルカリ発の推し活SNS『推しポート』デモ">
  <title>推しポート｜推し活SNSデモ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="demo-stage" aria-label="推しポート デモアプリ">
    <section class="phone-frame" aria-label="390×844 ピクセルのスマートフォン表示">
      <div class="phone-speaker" aria-hidden="true"></div>
      <div id="app" class="phone-screen"></div>
      <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    </section>
  </main>

  <noscript>このデモを利用するにはJavaScriptを有効にしてください。</noscript>

  <!-- 仕様書 §6 の順序: data → theme → state → screen-* → router -->
  <script src="data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/state.js"></script>
  <script src="js/screen-home.js"></script>
  <script src="js/screen-post.js"></script>
  <script src="js/screen-assets.js"></script>
  <script src="js/screen-mypage.js"></script>
  <script src="js/screen-tutorial.js"></script>
  <script src="js/screen-listing.js"></script>
  <script src="js/router.js"></script>

</html>
